<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f4ee">
<meta name="description" content="Merge frogs of the same level.">
<title>jabu</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app-shell">
<header class="topbar"><h1>jabu</h1><button id="sound-toggle" class="secondary-button" aria-pressed="true">Sound: on</button></header>
<section class="game-panel" aria-label="Game">
<div class="stats">
<div class="stat"><span>Score</span><strong id="score">0</strong></div>
<div class="stat"><span>Best score</span><strong id="best-score">0</strong></div>
<div class="stat"><span>Top level</span><strong id="max-level">3</strong></div>
<div class="stat"><span>Merges</span><strong id="merge-count">0</strong></div>
</div>
<div class="board-wrap"><div id="board" class="board" aria-label="3 by 3 game board"></div></div>
<p id="status" class="status-text" aria-live="polite"></p>
<div class="bottom-bar"><button id="new-game" class="secondary-button">New game</button></div>
<p class="help">Drag a frog onto a matching frog, or tap them one at a time.</p>
</section>
</main>
<div id="drag-ghost" class="drag-ghost" hidden><img alt=""></div>
<dialog id="game-over" aria-labelledby="over-title"><div class="modal-card"><h2 id="over-title">Game over</h2><p>No matching frogs left.</p><p id="final-score"></p><button id="restart" class="secondary-button">New game</button></div></dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
